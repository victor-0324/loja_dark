services:

  evolution:
    image: atendai/evolution-api:v2.1.1

    volumes:
      - evolution_instances:/evolution/instances

    environment:
      # URL
      - SERVER_URL=https://evo.kryptacode.com

      # AUTH
      - AUTHENTICATION_API_KEY=KRYPTA123456

      # Remove instâncias ao deletar
      - DEL_INSTANCE=false

      # DATABASE
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql

      - DATABASE_CONNECTION_URI=postgresql://postgres:post-loja@postgres:5432/evolution

      # DATABASE SAVE
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - DATABASE_SAVE_DATA_LABELS=true
      - DATABASE_SAVE_DATA_HISTORIC=true

      # REDIS
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1

      # QR CODE
      - QRCODE_LIMIT=30

      # LANGUAGE
      - LANGUAGE=pt-BR

      # WEBSOCKET
      - WEBSOCKET_ENABLED=true

      # CONFIG
      - CONFIG_SESSION_PHONE_CLIENT=Chrome
      - CONFIG_SESSION_PHONE_NAME=KryptaCode

    networks:
      - traefik_public

    deploy:
      mode: replicated
      replicas: 1

      placement:
        constraints:
          - node.role == manager

      labels:
        - "traefik.enable=true"

        # ROUTER
        - "traefik.http.routers.evolution.rule=Host(`evo.kryptacode.com`)"

        - "traefik.http.routers.evolution.entrypoints=websecure"

        - "traefik.http.routers.evolution.tls.certresolver=leresolver"

        # PORT
        - "traefik.http.services.evolution.loadbalancer.server.port=8080"

volumes:
  evolution_instances:

networks:
  traefik_public:
    external: true



services:

  postgres:
    image: postgres:16

    environment:
      POSTGRES_PASSWORD: post-loja
      POSTGRES_USER: postgres
      POSTGRES_DB: evolution

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - traefik_public

    deploy:
      placement:
        constraints:
          - node.role == manager

volumes:
  postgres_data:

networks:
  traefik_public:
    external: true