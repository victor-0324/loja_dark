{% extends "base_app.html" %}

{% block title %}Produtos — VendeMais{% endblock %}
{% block page_title %}Produtos{% endblock %}

{% block content %}
<div class="toolbar">
    <div class="toolbar-filters">
        <input type="text" id="filtro-pesquisa" class="form-control" placeholder="🔎 Buscar por nome, SKU..." style="min-width:260px;">
        <input type="text" id="filtro-categoria" class="form-control" placeholder="Categoria">
        <label style="display:flex; align-items:center; gap:6px; font-size:13px; color:var(--cor-texto-secundario);">
            <input type="checkbox" id="filtro-estoque"> Apenas com estoque
        </label>
    </div>
    <button class="btn btn-primary" onclick="abrirModalNovoProduto()">➕ Novo Produto</button>
</div>

<div class="card">
    <div id="produtos-loading" class="loader"></div>
    <table class="tabela" id="tabela-produtos" style="display:none;">
        <thead>
            <tr>
                <th>Produto</th>
                <th>SKU</th>
                <th>Categoria</th>
                <th>Preço</th>
                <th>Estoque</th>
                <th>Status</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="produtos-corpo"></tbody>
    </table>
    <p class="empty-state" id="produtos-vazio" style="display:none;">Nenhum produto encontrado</p>
    <div class="paginacao" id="produtos-paginacao"></div>
</div>

<!-- Modal Novo Produto -->
<div class="modal" id="modal-produto">
    <div class="modal-content">
        <span class="close" onclick="fecharModalNovoProduto()">&times;</span>
        <h2>Novo Produto</h2>
        <form id="form-novo-produto">
            <div class="form-grid">
                <input type="text" id="novo-nome" class="form-control" placeholder="Nome do produto" required>
                <input type="text" id="novo-sku" class="form-control" placeholder="SKU" required>
                <input type="text" id="novo-categoria" class="form-control" placeholder="Categoria (ex: Vestidos)" required>
                <input type="text" id="novo-subcategoria" class="form-control" placeholder="Subcategoria">
                <input type="number" step="0.01" id="novo-preco" class="form-control" placeholder="Preço (R$)" required>
                <input type="number" step="0.01" id="novo-preco-custo" class="form-control" placeholder="Preço de custo (R$)">
                <input type="number" id="novo-estoque" class="form-control" placeholder="Estoque inicial" value="0">
                <input type="number" id="novo-estoque-minimo" class="form-control" placeholder="Estoque mínimo" value="5">
            </div>
            <textarea id="novo-descricao" class="form-control" placeholder="Descrição" style="width:100%; min-height:80px; margin-bottom: 14px;"></textarea>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="fecharModalNovoProduto()">Cancelar</button>
                <button type="submit" class="btn btn-primary">Salvar Produto</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function carregarProdutos(pagina = 1) {
        document.getElementById('produtos-loading').style.display = 'block';
        document.getElementById('tabela-produtos').style.display = 'none';
        document.getElementById('produtos-vazio').style.display = 'none';

        const params = new URLSearchParams({
            pagina, por_pagina: 15,
            pesquisa: document.getElementById('filtro-pesquisa').value.trim(),
            categoria: document.getElementById('filtro-categoria').value.trim(),
            apenas_estoque: document.getElementById('filtro-estoque').checked
        });

        try {
            const resposta = await apiFetch(`/produtos?${params.toString()}`);
            const dados = await resposta.json();

            document.getElementById('produtos-loading').style.display = 'none';

            if (!dados.produtos || dados.produtos.length === 0) {
                document.getElementById('produtos-vazio').style.display = 'block';
                document.getElementById('produtos-paginacao').innerHTML = '';
                return;
            }

            document.getElementById('tabela-produtos').style.display = 'table';
            document.getElementById('produtos-corpo').innerHTML = dados.produtos.map(p => `
                <tr>
                    <td><strong>${p.nome}</strong></td>
                    <td>${p.sku}</td>
                    <td>${p.categoria}</td>
                    <td>${formatarMoeda(p.preco)}</td>
                    <td>${p.estoque_total} ${p.estoque_baixo ? '<span class="status-badge status-inativo">baixo</span>' : ''}</td>
                    <td><span class="status-badge ${p.ativo ? 'status-ativo' : 'status-inativo'}">${p.ativo ? 'ativo' : 'inativo'}</span></td>
                    <td><button class="btn btn-small btn-secondary" onclick="ajustarEstoque(${p.id}, ${p.estoque_total})">Estoque</button></td>
                </tr>
            `).join('');

            renderizarPaginacao(dados.paginacao);

        } catch (erro) {
            document.getElementById('produtos-loading').style.display = 'none';
            showAlert('Erro ao carregar produtos', 'error');
            console.error(erro);
        }
    }

    function renderizarPaginacao(paginacao) {
        const container = document.getElementById('produtos-paginacao');
        if (paginacao.total_paginas <= 1) {
            container.innerHTML = '';
            return;
        }
        let html = `<button ${paginacao.pagina <= 1 ? 'disabled' : ''} onclick="carregarProdutos(${paginacao.pagina - 1})">‹</button>`;
        for (let i = 1; i <= paginacao.total_paginas; i++) {
            html += `<button class="${i === paginacao.pagina ? 'active' : ''}" onclick="carregarProdutos(${i})">${i}</button>`;
        }
        html += `<button ${paginacao.pagina >= paginacao.total_paginas ? 'disabled' : ''} onclick="carregarProdutos(${paginacao.pagina + 1})">›</button>`;
        container.innerHTML = html;
    }

    async function ajustarEstoque(produtoId, estoqueAtual) {
        const novoValor = prompt('Novo valor de estoque total:', estoqueAtual);
        if (novoValor === null) return;
        const quantidade = parseInt(novoValor, 10);
        if (isNaN(quantidade) || quantidade < 0) {
            showAlert('Valor de estoque inválido', 'error');
            return;
        }
        try {
            const resposta = await apiFetch(`/produtos/${produtoId}/estoque`, {
                method: 'PATCH',
                body: JSON.stringify({ quantidade: quantidade, operacao: 'atualizar' })
            });
            if (!resposta.ok) {
                const dados = await resposta.json();
                throw new Error(dados.erro || 'Erro ao atualizar estoque');
            }
            showAlert('Estoque atualizado', 'success');
            carregarProdutos();
        } catch (erro) {
            showAlert(erro.message, 'error');
        }
    }

    function abrirModalNovoProduto() {
        document.getElementById('modal-produto').classList.add('open');
    }

    function fecharModalNovoProduto() {
        document.getElementById('modal-produto').classList.remove('open');
        document.getElementById('form-novo-produto').reset();
    }

    document.getElementById('form-novo-produto').addEventListener('submit', async (evento) => {
        evento.preventDefault();
        try {
            const resposta = await apiFetch('/produtos', {
                method: 'POST',
                body: JSON.stringify({
                    nome: document.getElementById('novo-nome').value.trim(),
                    sku: document.getElementById('novo-sku').value.trim(),
                    categoria: document.getElementById('novo-categoria').value.trim(),
                    subcategoria: document.getElementById('novo-subcategoria').value.trim(),
                    preco: parseFloat(document.getElementById('novo-preco').value),
                    preco_custo: document.getElementById('novo-preco-custo').value ? parseFloat(document.getElementById('novo-preco-custo').value) : null,
                    estoque_total: parseInt(document.getElementById('novo-estoque').value || 0, 10),
                    estoque_minimo: parseInt(document.getElementById('novo-estoque-minimo').value || 5, 10),
                    descricao: document.getElementById('novo-descricao').value.trim(),
                })
            });
            const dados = await resposta.json();

            if (!resposta.ok) throw new Error(dados.erro || 'Erro ao criar produto');

            showAlert('Produto criado com sucesso', 'success');
            fecharModalNovoProduto();
            carregarProdutos(1);

        } catch (erro) {
            showAlert(erro.message, 'error');
        }
    });

    document.getElementById('filtro-pesquisa').addEventListener('input', debounce(() => carregarProdutos(1), 450));
    document.getElementById('filtro-categoria').addEventListener('input', debounce(() => carregarProdutos(1), 450));
    document.getElementById('filtro-estoque').addEventListener('change', () => carregarProdutos(1));

    carregarProdutos();
</script>
{% endblock %}
